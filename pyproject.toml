[project]
name = "neosim"
version = "2.0.0"
description = "NeoSim 2.0 - a modern, event-aware NICU patient simulator powered by a single conditional flow-matching model."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Gurshan Riarh" },
]
keywords = ["NICU", "neonatal", "patient simulator", "flow matching", "synthetic data", "digital twin"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "scipy>=1.13",
  "torch>=2.6",
  "matplotlib>=3.9",
  "plotly>=5.24",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "rich>=13.9",
  "tqdm>=4.66",
  "scikit-learn>=1.5",
  "wfdb>=4.1",
  "requests>=2.32",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
]

[project.scripts]
neosim = "neosim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neosim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv]
package = true
